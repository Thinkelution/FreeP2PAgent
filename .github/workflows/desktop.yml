name: Desktop MVP
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: --win --x64
          - name: macOS ARM64
            os: macos-latest
            target: --mac --arm64
          - name: macOS Intel
            os: macos-15-intel
            target: --mac --x64
          - name: Linux x64
            os: ubuntu-24.04
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Desktop integration test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
      - name: Desktop integration test (macOS, external relay)
        if: runner.os == 'macOS'
        run: npm run test:e2e
        env:
          FP_E2E_COORDINATOR: wss://freep2pagent.thinkelution.com/ws
          FP_E2E_RELAY: '1'
      - name: Desktop integration test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:e2e
      - name: Build native installers
        run: npm run build -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: FreeP2PAgent-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results/
          if-no-files-found: ignore
